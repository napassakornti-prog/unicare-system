<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f68b5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>UniCare | ระบบบริหารห้องพยาบาล</title>
    <style>
      /* ซ่อน Scrollbar (ไอเลื่อนๆ) ทุกเบราว์เซอร์ ทั้งหน้าเว็บและองค์ประกอบย่อย แต่ยังคงเลื่อน (Scroll) ได้ลื่นไหล */
      html, body, #root, * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      ::-webkit-scrollbar {
        width: 0px !important;
        height: 0px !important;
        display: none !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-thumb,
      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner,
      ::-webkit-scrollbar-button {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
